 {name:'もりのマジックキノコ',hp:80,type:'mushroom',subtitle:'霧の森から あらわれた！'},
 {name:'よあけのコウモリ',hp:110,type:'bat',subtitle:'きらめく翼を ひろげた！'},
 {name:'わすれものゴーレム',hp:145,type:'golem',subtitle:'石の足音が ひびく！'},
 {name:'まよいのランタン',hp:180,type:'lantern',subtitle:'青い炎が ゆらめいている！'},

 {name:'ほしぐもドラゴン',hp:260,type:'dragon',subtitle:'星の光を まとっている！'}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const dayAdd=(d,n)=>{const a=new Date(d+'T12:00:00');a.setDate(a.getDate()+n);return day(a)};

const number=(x,fallback=0)=>Number.isFinite(Number(x))?Number(x):fallback;

const examDateLabel=d=>{const [y,m,n]=d.split('-');return `${Number(y)}年${Number(m)}月${Number(n)}日`};
const initial=()=>({settings:{name:'冒険者',dailyGoal:120,examDate:'',timerSubject:'英語'},exams:[],logs:[],notes:[],plans:[],scores:[],rpg:{xp:0,defeated:0,damage:0}});
function load(){try{const raw=JSON.parse(localStorage.getItem(KEY));if(!raw||typeof raw!=='object')return initial();const d=initial();return {...d,...raw,settings:{...d.settings,...(raw.settings||{})},rpg:{...d.rpg,...(raw.rpg||{})},exams:Array.isArray(raw.exams)?raw.exams:[],logs:Array.isArray(raw.logs)?raw.logs:[],notes:Array.isArray(raw.notes)?raw.notes:[],plans:Array.isArray(raw.plans)?raw.plans:[],scores:Array.isArray(raw.scores)?raw.scores:[]}}catch(e){return initial()}}
let data=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast('保存できません。ブラウザの空き容量を確認してください。')}}
let ui={tab:'home',answer:false,reviewId:'',editNote:null,scoreSubject:'英語',planView:'all',sound:'off',scoreExam:'',noteSubject:'all',editExam:null};
// Keep the existing storage key so previously saved study data and timer presets survive upgrades.
// Milliseconds are stored on pause: rounding to whole seconds used to lose time on rapid pause/resume.
let timer={mode:'focus',duration:1500,remaining:1500,remainingMs:1500000,running:false,deadline:null,subject:null};
try{
 const t=JSON.parse(localStorage.getItem(TIMER_KEY));
 if(t&&['focus','break'].includes(t.mode)&&Number.isInteger(t.duration)&&t.duration>0&&t.duration<=36000){
  const remainingMs=Number.isFinite(t.remainingMs)?t.remainingMs:Number(t.remaining)*1000;
  const normalizedMs=Math.max(0,Math.min(t.duration*1000,Number.isFinite(remainingMs)?remainingMs:t.duration*1000));
  const running=t.running===true&&Number.isFinite(t.deadline)&&t.deadline>0;
  timer={mode:t.mode,duration:t.duration,remaining:Math.ceil(normalizedMs/1000),remainingMs:normalizedMs,running,deadline:running?t.deadline:null,subject:typeof t.subject==='string'?t.subject:null};
 }
}catch(e){}
const saveTimer=()=>{try{localStorage.setItem(TIMER_KEY,JSON.stringify(timer))}catch(e){}};
const timerLeftMs=()=>timer.running?Math.max(0,timer.deadline-Date.now()):timer.remainingMs;
const timerDisplay=ms=>{const secs=Math.ceil(Math.max(0,ms)/1000);const hrs=Math.floor(secs/3600);return hrs?`${hrs}:${pad(Math.floor(secs%3600/60))}:${pad(secs%60)}`:`${pad(Math.floor(secs/60))}:${pad(secs%60)}`};
const level=()=>1+Math.floor(Math.sqrt(data.rpg.xp/95));
const nextLevelXP=()=>Math.pow(level(),2)*95;
const xpPrev=()=>Math.pow(level()-1,2)*95;
const curEnemy=()=>MONSTERS[data.rpg.defeated%MONSTERS.length];
const enemyHp=()=>curEnemy().hp+Math.floor(data.rpg.defeated/MONSTERS.length)*65;
function recalcRpg(){const total=data.logs.reduce((a,x)=>a+Math.max(0,number(x.minutes)),0),reviewXp=data.notes.reduce((a,x)=>a+Math.max(0,number(x.correctCount))*2,0);let damage=total,defeated=0;while(damage>=MONSTERS[defeated%MONSTERS.length].hp+Math.floor(defeated/MONSTERS.length)*65){damage-=MONSTERS[defeated%MONSTERS.length].hp+Math.floor(defeated/MONSTERS.length)*65;defeated++}data.rpg={xp:total+reviewXp,defeated,damage}}
const logsFor=d=>data.logs.filter(x=>x.date===d);
const minutesFor=d=>logsFor(d).reduce((s,x)=>s+number(x.minutes),0);
const dueNotes=()=>data.notes.filter(n=>!n.nextReview||n.nextReview<=day()).sort((a,b)=>String(a.nextReview).localeCompare(String(b.nextReview)));
function streak(){let n=0,cur=day();if(minutesFor(cur)===0)cur=dayAdd(cur,-1);while(minutesFor(cur)>0&&n<999){n++;cur=dayAdd(cur,-1)}return n}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),3200)}
function addXp(minutes){const amount=Math.max(0,Math.round(minutes));data.rpg.xp+=amount;let damage=amount;let defeatedNow=0;while(damage>0){const rest=enemyHp()-data.rpg.damage;if(damage>=rest){damage-=rest;data.rpg.defeated++;data.rpg.damage=0;defeatedNow++}else{data.rpg.damage+=damage;damage=0}}return defeatedNow}
function logStudy(minutes,subject,mode='手動'){minutes=Math.round(number(minutes));if(!(minutes>=1&&minutes<=600)){toast('記録時間は1〜600分で入力してね');return false}const wins=addXp(minutes);data.logs.push({id:uid(),date:day(),minutes,subject:SUBJECTS.includes(subject)?subject:'その他',mode,createdAt:Date.now()});save();toast(`📚 ${minutes}分記録！ +${minutes}XP${wins?` / 敵を${wins}体たおした！`:''}`);render();return true}
function renderNav(){const markup=NAV.map(([id,ico,name])=>`<button type="button" class="${ui.tab===id?'active':''}" data-nav="${id}"><span class="ico">${ico}</span><span>${name}</span>${id==='review'&&dueNotes().length?`<span class="badge-count">${dueNotes().length}</span>`:''}</button>`).join('');$('#desktopNav').innerHTML=markup;$('#mobileNav').innerHTML=markup}
function navigate(tab){ui.tab=tab;ui.answer=false;ui.reviewId='';window.scrollTo({top:0,behavior:'instant'});render()}
function render(){renderNav();$('#pageHeading').textContent=({home:'ダッシュボード',timer:'集中タイマー',review:'今日の復習',notes:'間違い問題ノート',plans:'勉強計画',scores:'模試・テスト分析',rpg:'勉強RPG'})[ui.tab];$('#dateLabel').textContent=new Intl.DateTimeFormat('ja-JP',{month:'long',day:'numeric',weekday:'short'}).format(new Date());$('#levelLabel').textContent='⚔ LV.'+level();$('#headerWelcome').textContent=`${data.settings.name} の勉強冒険`;$('#content').innerHTML=({home:renderHome,timer:renderTimer,review:renderReview,notes:renderNotes,plans:renderPlans,scores:renderScores,rpg:renderRpg})[ui.tab]();if(ui.tab==='timer')paintTimer()}
function renderExamCountdown(){
 const exams=data.exams.slice().filter(x=>x&&validExamDate(x.date)&&typeof x.name==='string').sort((a,b)=>a.date.localeCompare(b.date));
 const future=exams.filter(x=>dayDiff(x.date,day())>=0),next=future[0],editing=data.exams.find(x=>x.id===ui.editExam);
 const featured=next?`<div class="exam-spotlight"><div style="min-width:0"><div class="tiny">NEXT EXAM · 次の試験</div><div class="exam-title mt12">${esc(next.name)}</div><div class="exam-date">${examDateLabel(next.date)}</div></div><div class="exam-count ${next.date===day()?'today':''}">${next.date===day()?'当日':`あと ${dayDiff(next.date,day())}`}<small>${next.date===day()?'':' 日'}</small></div></div>`:
 `<div class="empty"><span class="em">📅</span>試験の日付を登録すると、ここに残り日数が表示されるよ。</div>`;
 const list=exams.length?`<div class="list mt16">${exams.map(x=>{const left=dayDiff(x.date,day());return `<div class="item"><div class="item-main"><strong>${esc(x.name)}</strong><small>${examDateLabel(x.date)}</small></div><span class="pill ${left===0?'orange':left>0?'mint':''}">${left>0?`あと${left}日`:left===0?'今日':'終了'}</span><button class="btn secondary slim" data-action="editExam" data-id="${esc(x.id)}" aria-label="${esc(x.name)}を編集">編集</button><button class="btn danger slim" data-action="deleteExam" data-id="${esc(x.id)}" aria-label="${esc(x.name)}を削除">×</button></div>`}).join('')}</div>`:'';
 return `<div class="grid"><div class="card span7"><div class="card-title">🎯 試験までのカウントダウン <small>${future.length}件の予定</small></div>${featured}${list}<p class="caption">残り日数は試験当日を0日として計算。日付が変わると更新されるよ。</p></div><div class="card span5"><div class="card-title">📌 ${editing?'試験を編集':'試験を登録'}</div><form id="examForm"><div class="form-grid"><div class="field full"><label>試験名</label><input name="examName" maxlength="60" placeholder="例：共通テスト、定期テスト" value="${esc(editing?.name||'')}" required></div><div class="field full"><label>試験日</label><input type="date" name="examDate" min="2000-01-01" max="2100-12-31" value="${esc(editing?.date||((data.settings.examDate&&data.settings.examDate>=day())?data.settings.examDate:dayAdd(day(),30)))}" required></div><div class="full buttons"><button class="btn" type="submit">${editing?'変更を保存':'＋ 試験を登録'}</button>${editing?'<button type="button" class="btn secondary" data-action="cancelExamEdit">キャンセル</button>':''}</div></div></form><p class="caption">複数の試験を登録できます。試験名・日付はあとから編集可能です。</p></div></div>`;
}
function renderHome(){const today=minutesFor(day()),goal=number(data.settings.dailyGoal,120)||120,week=Array.from({length:7},(_,i)=>{const d=dayAdd(day(),i-6);return {d,m:minutesFor(d)}}),wSum=week.reduce((a,b)=>a+b.m,0),percent=Math.min(100,Math.round(today/goal*100));const upcoming=data.plans.filter(x=>!x.done).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4);
return `<div class="hero"><div><span class="kicker">TODAY'S QUEST</span><h2>今日も、経験値を積み上げよう。</h2><p>勉強を始めるたびに、あなたの冒険が少しずつ進む。まずは最初の25分から。</p><button class="btn" data-nav="timer">⏱ 集中を始める →</button></div><div class="hero-art" aria-hidden="true">📖✨</div></div>

<div class="card span7"><div class="card-title">📊 7日間の学習グラフ <small>1日ごとの合計（分）</small></div><div class="timeline">${week.map(({d,m})=>`<div class="bar-group" title="${d}: ${m}分"><div class="bar ${d===day()?'today':''}" style="height:${Math.max(4,Math.round(m/Math.max(goal,...week.map(x=>x.m),1)*91))}px"></div><div class="bar-label">${['日','月','火','水','木','金','土'][new Date(d+'T12:00:00').getDay()]}</div></div>`).join('')}</div><div class="tiny mt16">1日目標：${goal}分　·　棒を長押しすると学習分数が見られる</div></div>
<div class="card span5"><div class="card-title">🎯 今日の目標</div><div class="ring-stats"><div class="ring" style="--p:${percent}%"><span>${percent}%<small>達成率</small></span></div><div><div class="soft" style="font-weight:850;font-size:17px">${today>=goal?'目標クリア！':'あと '+fmtMin(Math.max(0,goal-today))}</div><div class="tiny">今日の目標まで</div><button class="btn secondary slim mt12" data-action="settings">目標を変更</button></div></div></div>
<div class="card span6"><div class="card-title">🗓 これからの予定 <button class="btn ghost slim" data-nav="plans">計画を見る →</button></div>${upcoming.length?`<div class="list">${upcoming.map(p=>`<div class="item"><div class="item-main"><strong>${esc(p.title)}</strong><small>${esc(p.subject)} · ${readable(p.date)}${p.date<day()?' · 期限超過':''}</small></div><span class="pill ${p.date<=day()?'orange':''}">${p.date===day()?'今日':readable(p.date)}</span></div>`).join('')}</div>`:`<div class="empty"><span class="em">🗓</span>まだ予定はないよ。<br>学習計画を作ってみよう。</div>`}</div>
<div class="card span6"><div class="card-title">⚔️ 次の敵</div><div class="flex-between"><div><div style="font-weight:900;font-size:17px">${esc(curEnemy().name)}</div><div class="tiny">HP ${enemyHp()-data.rpg.damage} / ${enemyHp()}</div><div class="progress mt12" style="min-width:160px"><i style="background:var(--orange);width:${Math.max(0,(enemyHp()-data.rpg.damage)/enemyHp()*100)}%"></i></div><button class="btn secondary slim mt16" data-nav="rpg">冒険を確認 →</button></div><div style="width:140px;height:118px">${monsterSvg(curEnemy().type)}</div></div></div>
<div class="card span12"><div class="card-title">🧱 直近14週間の勉強記録 <small>濃いほど勉強時間が長い</small></div><div class="heatmap">${Array.from({length:98},(_,i)=>{const d=dayAdd(day(),i-97),m=minutesFor(d),h=m===0?0:m<20?1:m<50?2:m<100?3:4;return `<span class="heat h${h}" title="${d}: ${m}分"></span>`}).join('')}</div><p class="caption">データはこのブラウザ内に保存されるよ。機種変更前にはバックアップしてね。</p></div>
<div class="card span12"><div class="card-title">📝 最近の学習記録 <small>間違えて記録した場合は削除できます</small></div>${data.logs.length?`<div class="list">${data.logs.slice().sort((a,b)=>number(b.createdAt)-number(a.createdAt)).slice(0,8).map(x=>`<div class="item"><div class="item-main"><strong>${esc(x.subject)} · ${fmtMin(x.minutes)}</strong><small>${readable(x.date)} · ${esc(x.mode)}</small></div><button class="btn danger slim" aria-label="記録を削除" data-action="deleteLog" data-id="${esc(x.id)}">削除</button></div>`).join('')}</div>`:`<div class="empty">最初の勉強を記録してみよう。</div>`}</div></div>`}

function renderReview(){const due=dueNotes();let note=due.find(n=>n.id===ui.reviewId)||due[0];if(note)ui.reviewId=note.id;return `<div class="grid"><div class="span8"><div class="card"><div class="title-row"><h2>🧠 思い出す練習</h2><span class="pill ${due.length?'orange':'mint'}">今日の復習 ${due.length}問</span></div>${note?`<p class="small-hint">答えを見る前に、頭の中で説明してみよう。</p><div class="review-card mt16"><span class="tiny">${esc(note.subject)} · QUESTION</span><div class="review-q">${esc(note.question||note.title)}</div>${ui.answer?`<div class="divider" style="margin:0 0 1px"></div><div class="review-a">${esc(note.answer)}</div>`:''}</div><div class="buttons mt16" style="justify-content:center">${ui.answer?`<button class="btn danger" data-action="reviewRate" data-result="again">↻ もう一度</button><button class="btn" data-action="reviewRate" data-result="good">✓ 覚えていた</button>`:`<button class="btn" data-action="showAnswer">答えを見る →</button>`}</div><div class="caption" style="text-align:center">覚えていたら次の復習までの間隔が長くなるよ。</div>`:`<div class="empty"><span class="em">🎉</span><strong>今日の復習は完了！</strong><br>新しい問題を登録して、記憶を定着させよう。<div class="mt16"><button class="btn" data-nav="notes">問題を登録する</button></div></div>`}</div></div><div class="span4"><div class="card"><div class="card-title">📅 復習スケジュール</div><div class="list">${[0,1,3,7].map(offset=>{const d=dayAdd(day(),offset);const count=data.notes.filter(n=>n.nextReview===d).length;return `<div class="item"><div class="item-main"><strong>${offset===0?'今日':offset===1?'明日':readable(d)}</strong><small>${count}問の復習予定</small></div><span class="pill">${count}問</span></div>`}).join('')}</div><p class="caption">覚えた問題は、翌日・3日後・7日後・14日後・30日後を目安に復習間隔が延びるよ。</p></div><div class="card mt16"><div class="card-title">📓 登録した問題</div><div class="metric">${data.notes.length}<small> 問</small></div><button class="btn secondary slim mt12" data-nav="notes">間違いノートを見る →</button></div></div></div>`}
function noteEditor(){const n=data.notes.find(x=>x.id===ui.editNote)||null;return `<div class="card"><div class="card-title">${n?'✏️ 問題を編集':'➕ 新しい間違いを記録'}</div><form id="noteForm"><div class="form-grid"><div class="field"><label>科目</label><select name="subject">${subjectOptions(n?n.subject:data.settings.timerSubject)}</select></div><div class="field"><label>問題のタイトル</label><input name="title" maxlength="80" required placeholder="例：光合成のカルビン回路" value="${esc(n?.title||'')}"></div><div class="field full"><label>問題・問い</label><textarea name="question" maxlength="2000" required placeholder="何を答えられなかった？">${esc(n?.question||'')}</textarea></div><div class="field full"><label>答え・解説</label><textarea name="answer" maxlength="3000" required placeholder="自分の言葉でわかりやすくまとめよう">${esc(n?.answer||'')}</textarea></div><div class="buttons full"><button class="btn" type="submit">${n?'変更を保存':'＋ ノートに追加'}</button>${n?`<button class="btn secondary" type="button" data-action="cancelEdit">キャンセル</button>`:''}</div></div></form></div>`}
function renderNotes(){const notes=data.notes.filter(n=>ui.noteSubject==='all'||ui.noteSubject===n.subject).slice().sort((a,b)=>number(b.createdAt)-number(a.createdAt));return `<div class="grid"><div class="span5">${noteEditor()}</div><div class="span7"><div class="card"><div class="title-row"><h2>📓 間違い問題一覧 (${data.notes.length})</h2><select class="select-inline" data-change="noteFilter"><option value="all">全科目</option>${SUBJECTS.map(s=>`<option ${ui.noteSubject===s?'selected':''} value="${esc(s)}">${esc(s)}</option>`).join('')}</select></div>${notes.length?`<div class="list">${notes.map(n=>`<div class="item" style="align-items:flex-start"><div class="item-main"><div class="flex-between"><strong>${esc(n.title)}</strong><span class="pill ${n.nextReview<=day()?'orange':'mint'}">${n.nextReview<=day()?'復習待ち':'次回 '+readable(n.nextReview)}</span></div><small>${esc(n.subject)} · ${readable(safeDate(n.createdDate||n.nextReview||day()))} · 正解${number(n.correctCount)}回</small><div class="note-text mt12"><span class="muted">Q.</span> ${esc(n.question)}</div><details class="mt12"><summary class="tiny" style="cursor:pointer">答え・解説を表示</summary><div class="note-text mt12 good">${esc(n.answer)}</div></details><div class="buttons mt12"><button class="btn secondary slim" data-action="editNote" data-id="${esc(n.id)}">編集</button><button class="btn danger slim" data-action="deleteNote" data-id="${esc(n.id)}">削除</button></div></div></div>`).join('')}</div>`:`<div class="empty"><span class="em">📝</span>まだ問題がないよ。<br>今日の間違いを1問記録しよう。</div>`}</div></div></div>`}
function renderPlans(){const list=data.plans.slice().filter(p=>ui.planView==='all'||(ui.planView==='todo'&&!p.done)||(ui.planView==='done'&&p.done)).sort((a,b)=>Number(a.done)-Number(b.done)||a.date.localeCompare(b.date));const done=data.plans.filter(p=>p.done).length;const pct=data.plans.length?Math.round(done/data.plans.length*100):0;return `<div class="grid"><div class="span5"><div class="card"><div class="card-title">✍️ 予定を追加</div><form id="planForm"><div class="form-grid"><div class="field full"><label>学習内容</label><input name="title" required maxlength="120" placeholder="例：数学の確率を20問解く"></div><div class="field"><label>科目</label><select name="subject">${subjectOptions(data.settings.timerSubject)}</select></div><div class="field"><label>取り組む日</label><input type="date" name="date" value="${day()}" required></div><div class="field full"><label>予定時間（分）</label><input type="number" name="minutes" min="1" max="600" value="30" required></div><div class="full"><button class="btn" type="submit" style="width:100%">＋ 予定を追加</button></div></div></form></div>
<div class="card mt16"><div class="card-title">✨ 学習計画を自動作成</div><p class="muted" style="font-size:12px;margin-top:0">学習したい項目を1行ずつ入力すると、指定日までに分散して予定を作るよ。</p><form id="autoPlanForm"><div class="form-grid"><div class="field"><label>科目</label><select name="subject">${subjectOptions(data.settings.timerSubject)}</select></div><div class="field"><label>完了したい日</label><input type="date" name="endDate" value="${data.settings.examDate||dayAdd(day(),14)}" required></div><div class="field full"><label>学習項目（1行1つ）</label><textarea name="topics" required placeholder="英単語100語\n長文読解3題\n文法の復習"></textarea></div><div class="field full"><label>1項目あたりの目安（分）</label><input name="minutes" type="number" min="1" max="600" value="40" required></div><div class="full"><button class="btn secondary" style="width:100%" type="submit">📅 予定を自動で割り当てる</button></div></div></form></div></div>
<div class="span7"><div class="card"><div class="card-title">🗓 学習計画の進み具合</div><div class="flex-between"><div class="metric">${pct}<small>% 完了</small></div><div class="muted">${done} / ${data.plans.length}件</div></div><div class="progress mt12"><i style="width:${pct}%"></i></div><div class="tab-rows mt22">${[['all','すべて'],['todo','未完了'],['done','完了済み']].map(([v,t])=>`<button data-action="planFilter" data-filter="${v}" class="${ui.planView===v?'active':''}">${t}</button>`).join('')}</div><div class="list mt16">${list.length?list.map(p=>`<div class="item"><button class="check-btn ${p.done?'on':''}" data-action="togglePlan" data-id="${esc(p.id)}" aria-label="予定を${p.done?'未完了':'完了'}にする">${p.done?'✓':''}</button><div class="item-main"><strong style="${p.done?'text-decoration:line-through;opacity:.55':''}">${esc(p.title)}</strong><small>${esc(p.subject)} · ${readable(p.date)} · ${fmtMin(p.minutes||0)}${!p.done&&p.date<day()?' · 期限超過':''}</small></div><button class="btn danger slim" aria-label="予定を削除" data-action="deletePlan" data-id="${esc(p.id)}">×</button></div>`).join(''):`<div class="empty"><span class="em">✅</span>該当する予定はないよ。</div>`}</div></div></div></div>`}
function renderScores(){const selected=ui.scoreSubject;const records=data.scores.filter(s=>s.subject===selected).sort((a,b)=>a.date.localeCompare(b.date));const all=data.scores.slice().sort((a,b)=>b.date.localeCompare(a.date));const latest=records[records.length-1],average=records.length?Math.round(records.reduce((a,b)=>a+b.score/b.max*100,0)/records.length):0;return `<div class="grid"><div class="span5"><div class="card"><div class="card-title">✍️ テスト結果を登録</div><form id="scoreForm"><div class="form-grid"><div class="field full"><label>模試・テスト名</label><input name="title" placeholder="例：第2回共通テスト模試" maxlength="100" required></div><div class="field"><label>科目</label><select name="subject">${subjectOptions(ui.scoreSubject)}</select></div><div class="field"><label>受験日</label><input type="date" name="date" value="${day()}" required></div><div class="field"><label>得点</label><input type="number" name="score" min="0" max="1000" value="65" required></div><div class="field"><label>満点</label><input type="number" name="max" min="1" max="1000" value="100" required></div><div class="full"><button class="btn" type="submit" style="width:100%">＋ 結果を記録</button></div></div></form></div>
<div class="card mt16"><div class="card-title">📈 勉強の成績データ</div><div class="metric">${data.scores.length}<small> 件</small></div><p class="caption">科目ごとに得点率を比較できる。配点が違っても同じグラフで見られるよ。</p></div></div>
<div class="span7"><div class="card"><div class="title-row"><h2>📊 成績の推移</h2><select class="select-inline" data-change="scoreSubject">${subjectOptions(selected)}</select></div>${records.length?`<div class="flex-between"><div><div class="tiny">最新の得点率</div><div class="metric good">${Math.round(latest.score/latest.max*100)}<small>%</small></div></div><div><div class="tiny">平均得点率</div><div class="metric">${average}<small>%</small></div></div><div><div class="tiny">記録回数</div><div class="metric">${records.length}<small> 回</small></div></div></div><div class="chart mt16">${scoreChart(records)}</div>`:`<div class="empty"><span class="em">📊</span>${esc(selected)}の結果はまだないよ。<br>左のフォームから登録しよう。</div>`}</div><div class="card mt16"><div class="card-title">🧾 登録した成績</div><div class="list score-history">${all.length?all.map(x=>`<div class="item"><div class="item-main"><strong>${esc(x.title)}</strong><small>${esc(x.subject)} · ${readable(x.date)}</small></div><div style="font-weight:900;white-space:nowrap">${x.score}/${x.max}<small class="muted"> (${Math.round(x.score/x.max*100)}%)</small></div><button class="btn danger slim" data-action="deleteScore" data-id="${esc(x.id)}" aria-label="成績を削除">×</button></div>`).join(''):`<div class="empty">まだ成績がないよ。</div>`}</div></div></div></div>`}
function scoreChart(records){const W=600,H=225,l=43,r=22,t=15,b=37,x=i=>l+(records.length===1?(W-l-r)/2:i*(W-l-r)/(records.length-1)),y=v=>t+(100-v)*(H-t-b)/100;const pts=records.map((a,i)=>[x(i),y(a.score/a.max*100)]);return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="得点率推移。${records.map(a=>`${a.date} ${Math.round(a.score/a.max*100)}%`).join('、')}">${[0,25,50,75,100].map(v=>`<line x1="${l}" y1="${y(v)}" x2="${W-r}" y2="${y(v)}" stroke="#31425a" stroke-width="1"/><text x="${l-9}" y="${y(v)+4}" text-anchor="end" fill="#a7b5c9" font-size="11">${v}%</text>`).join('')}${pts.length>1?`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#79e8bd" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>`:''}${pts.map(([px,py],i)=>`<circle cx="${px}" cy="${py}" r="6" fill="#79e8bd" stroke="#152538" stroke-width="3"/><text x="${px}" y="${Math.max(12,py-13)}" fill="#e8fff3" text-anchor="middle" font-size="13" font-weight="bold">${Math.round(records[i].score/records[i].max*100)}%</text><text x="${px}" y="${H-11}" fill="#abbacc" text-anchor="middle" font-size="10">${readable(records[i].date)}</text>`).join('')}</svg>`}
function renderRpg(){const enemy=curEnemy(),hp=enemyHp(),left=hp-data.rpg.damage,pct=Math.max(0,Math.round(left/hp*100)),lv=level(),nxt=nextLevelXP(),prev=xpPrev(),pctXp=Math.min(100,(data.rpg.xp-prev)/(nxt-prev)*100),total=data.logs.reduce((s,x)=>s+number(x.minutes),0);return `<div class="hero"><div><div class="kicker">STUDY × FANTASY RPG</div><h2>勉強した分だけ、冒険が進む。</h2><p>1分の勉強 = 1経験値と1ダメージ。記録を積み重ねて、オリジナルのモンスターたちを倒そう！</p><button class="btn gold" data-nav="timer">⚔ 勉強して攻撃する →</button></div><div class="hero-art">⚔️</div></div><div class="grid"><div class="span7"><div class="card"><div class="flex-between"><span class="pill orange">ENCOUNTER ${data.rpg.defeated+1}</span><span class="tiny">討伐数 ${data.rpg.defeated} 体</span></div><div class="battle mt16"><div class="battle-stars"></div><div class="monster" aria-label="${esc(enemy.name)}のイラスト">${monsterSvg(enemy.type)}</div><div class="monster-name">${esc(enemy.name)}</div><div class="tiny">${esc(enemy.subtitle)}</div></div><div class="hp-row mt16"><span class="bad">HP</span><div class="progress"><i style="width:${pct}%"></i></div><span class="kbd">${left}/${hp}</span></div><div class="fight-note mt16">⚔️ <strong>${esc(enemy.name)}</strong> が 待ちかまえている！<br>次の学習で <strong>${left}分</strong> 勉強すると倒せるよ。<br><span class="tiny">※討伐は自動。余ったダメージは次の敵に引き継がれるよ。</span></div></div></div><div class="span5"><div class="card"><div class="card-title">🛡 あなたの冒険者データ</div><div class="flex-between"><div><div class="tiny">現在のレベル</div><div class="metric warn">Lv.${lv}</div></div><div style="font-size:48px">🧙</div></div><div class="flex-between mt16"><span class="muted">経験値</span><strong>${data.rpg.xp} / ${nxt} XP</strong></div><div class="progress mt12"><i style="width:${pctXp}%"></i></div><div class="caption">次のレベルまで ${Math.max(0,nxt-data.rpg.xp)} XP</div><div class="divider"></div><div class="flex-between"><span class="muted">これまでの勉強</span><strong>${fmtMin(total)}</strong></div><div class="flex-between mt12"><span class="muted">倒した敵</span><strong>${data.rpg.defeated}体</strong></div><div class="flex-between mt12"><span class="muted">連続勉強</span><strong>${streak()}日</strong></div></div><div class="card mt16"><div class="card-title">🏆 冒険の実績</div><div class="list">${[[1,'初めての一撃','1分以上勉強する'],[60,'はじめの60分','合計60分勉強する'],[300,'努力の証','合計300分勉強する'],[900,'継続の達人','合計900分勉強する']].map(([needed,label,desc])=>`<div class="item" style="opacity:${total>=needed?1:.48}"><span style="font-size:24px">${total>=needed?'🏅':'🔒'}</span><div class="item-main"><strong>${label}</strong><small>${desc}</small></div>${total>=needed?'<span class="pill mint">達成</span>':''}</div>`).join('')}</div></div></div></div><p class="caption">敵キャラは本アプリ用に描いたオリジナルキャラクターです。</p>`}

let audio=null;
function stopAudio(){if(!audio)return;try{audio.source.stop()}catch(e){}try{audio.context.close()}catch(e){}audio=null;ui.sound='off'}
function soundOn(type){stopAudio();if(type==='off'){render();return}try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('no audio');const context=new AC();const buffer=context.createBuffer(1,context.sampleRate*3,context.sampleRate),arr=buffer.getChannelData(0);let prev=0;for(let i=0;i<arr.length;i++){const white=Math.random()*2-1;prev=(prev+0.03*white)/1.03;arr[i]=type==='rain'?white*.19+prev*.35:prev*.9}const source=context.createBufferSource();source.buffer=buffer;source.loop=true;const low=context.createBiquadFilter();low.type='lowpass';low.frequency.value=type==='rain'?1450:450;const vol=context.createGain();vol.gain.value=type==='rain'?.12:.24;source.connect(low);low.connect(vol);vol.connect(context.destination);source.start();audio={context,source};ui.sound=type;render();toast(type==='rain'?'雨音を再生中':'風の音を再生中')}catch(e){toast('この端末では環境音を再生できません');ui.sound='off'}}
function paintTimer(){
 const remainingMs=timerLeftMs();
 const remaining=Math.ceil(remainingMs/1000);
 timer.remaining=remaining;
 const digits=$('#timerDigits');if(digits)digits.textContent=timerDisplay(remainingMs);
 const rem=$('#timerRemainingDetail');if(rem)rem.textContent=timerDisplay(remainingMs);
 const elapsed=$('#timerElapsedDetail');if(elapsed)elapsed.textContent=timerDisplay(timer.duration*1000-remainingMs);
 const circle=$('#timerCircle');
 if(circle){circle.style.setProperty('--p',`${Math.min(100,Math.max(0,(1-remainingMs/(timer.duration*1000))*100))}%`);circle.setAttribute('aria-label',`残り ${timerDisplay(remainingMs)}、経過 ${timerDisplay(timer.duration*1000-remainingMs)}`)}
 const btn=$('#timerStartBtn');
 if(btn){btn.textContent=timer.running?'⏸ 一時停止':remainingMs<timer.duration*1000?'▶ 再開':'▶ 開始';btn.setAttribute('aria-pressed',String(timer.running))}
 const state=$('#timerStateText');
 if(state)state.textContent=timer.running?'集中して進もう':remainingMs<timer.duration*1000?'一時停止中':'始める準備はOK？';
}
function timerFinish(){
 if(!timer.running)return false;
 const wasFocus=timer.mode==='focus',minutes=Math.round(timer.duration/60),subject=timer.subject||data.settings.timerSubject;
 // Persist the stopped state before logging: returning to the foreground must not log twice.
 timer.running=false;timer.deadline=null;timer.remainingMs=timer.duration*1000;timer.remaining=timer.duration;timer.subject=null;
 saveTimer();
 if(wasFocus)logStudy(minutes,subject,'集中タイマー');
 else{render();toast('☕ 休憩おしまい！ 集中を始めよう')}
 return true;
}
function timerTick(){
 if(timer.running){
  if(timerLeftMs()<=0){timerFinish();return}
  timer.remaining=Math.ceil(timerLeftMs()/1000);
 }
 if(ui.tab==='timer')paintTimer();
}
function preset(minutes,mode){
 if(!Number.isInteger(minutes)||minutes<1||minutes>600||!['focus','break'].includes(mode)){toast('1〜600分の範囲で設定してね');return}
 if(timer.running||timerLeftMs()<timer.duration*1000){
  if(timerLeftMs()<=0){timerFinish();return}
  if(!confirm('現在のタイマーを終了して切り替える？'))return;
 }
 timer={mode,duration:minutes*60,remaining:minutes*60,remainingMs:minutes*60000,running:false,deadline:null,subject:null};
 saveTimer();render();
}
let lastTimerTap=0;
function timerStart(){
 // Ignore accidental double taps that would instantly undo a start/pause operation.
 const now=Date.now();if(now-lastTimerTap<250)return;lastTimerTap=now;
 if(timer.running){
  const left=timerLeftMs();
  if(left<=0){timerFinish();return}
  timer.remainingMs=left;timer.remaining=Math.ceil(left/1000);timer.running=false;timer.deadline=null;
 }else{
  if(timer.remainingMs<=0)timer.remainingMs=timer.duration*1000;
  timer.running=true;timer.deadline=now+timer.remainingMs;
  timer.subject=data.settings.timerSubject;
 }
 saveTimer();paintTimer();
}
function timerReset(){
 timer.running=false;timer.deadline=null;timer.remaining=timer.duration;timer.remainingMs=timer.duration*1000;timer.subject=null;
 saveTimer();paintTimer();toast('タイマーをリセットしたよ');
}
function timerComplete(){
 const left=timerLeftMs();
 const elapsedMs=timer.duration*1000-left;
 const mins=Math.floor(elapsedMs/60000);
 const wasFocus=timer.mode==='focus',subject=timer.subject||data.settings.timerSubject;
 // A completed countdown logs the full scheduled session once.
 if(timer.running&&left<=0){timerFinish();return}
 timer.running=false;timer.deadline=null;timer.remaining=timer.duration;timer.remainingMs=timer.duration*1000;timer.subject=null;
 saveTimer();
 if(wasFocus&&mins>=1)logStudy(mins,subject,'集中タイマー');
 else{render();toast(wasFocus?'1分以上集中すると記録できるよ':'休憩タイマーを終了したよ')}
}
// All interaction handlers are delegated so that rerendering does not lose event listeners.
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){navigate(nav.dataset.nav);return}const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,id=el.dataset.id;switch(action){case 'editExam':ui.editExam=id;ui.tab='home';render();window.scrollTo({top:0,behavior:'smooth'});break;case 'cancelExamEdit':ui.editExam=null;render();break;case 'deleteExam':{const x=data.exams.find(z=>z.id===id);if(!x)return;if(!confirm(`「${x.name}」を削除する？`))return;data.exams=data.exams.filter(z=>z.id!==id);if(ui.editExam===id)ui.editExam=null;save();render();toast('試験を削除したよ');break}case 'settings':{const raw=prompt('1日の目標勉強時間（分）を入力してね',data.settings.dailyGoal);if(raw===null)return;const val=Number(raw);if(!Number.isInteger(val)||val<1||val>1440){toast('1〜1440分の整数で入力してね');return}data.settings.dailyGoal=val;save();render();break}case 'timerPreset':preset(number(el.dataset.minutes),el.dataset.mode);break;case 'timerStart':timerStart();break;case 'timerReset':timerReset();break;case 'timerComplete':timerComplete();break;case 'sound':soundOn(el.dataset.sound);break;case 'showAnswer':ui.answer=true;render();break;case 'reviewRate':{const n=data.notes.find(x=>x.id===ui.reviewId);if(!n)return;if(el.dataset.result==='good'){n.correctCount=number(n.correctCount)+1;n.step=Math.min(5,number(n.step)+1);n.nextReview=dayAdd(day(),[0,1,3,7,14,30][n.step]);data.rpg.xp+=2;toast('正解！ 次回の復習日を更新 +2XP')}else{n.step=0;n.nextReview=dayAdd(day(),1);toast('明日もう一度復習しよう！')}n.lastReviewed=day();save();ui.answer=false;ui.reviewId='';render();break}case 'editNote':ui.editNote=id;render();window.scrollTo({top:0,behavior:'smooth'});break;case 'cancelEdit':ui.editNote=null;render();break;case 'deleteNote':if(!confirm('この問題を削除する？'))return;data.notes=data.notes.filter(x=>x.id!==id);if(ui.editNote===id)ui.editNote=null;recalcRpg();save();render();break;case 'deleteLog':if(!confirm('この学習記録を削除する？ 獲得XPと敵へのダメージも修正されます。'))return;data.logs=data.logs.filter(x=>x.id!==id);recalcRpg();save();render();toast('学習記録を削除したよ');break;case 'togglePlan':{const p=data.plans.find(x=>x.id===id);if(!p)return;p.done=!p.done;save();render();break}case 'deletePlan':if(!confirm('この予定を削除する？'))return;data.plans=data.plans.filter(x=>x.id!==id);save();render();break;case 'planFilter':ui.planView=el.dataset.filter;render();break;case 'deleteScore':if(!confirm('この成績を削除する？'))return;data.scores=data.scores.filter(x=>x.id!==id);save();render();break;case 'export':exportData();break;case 'resetAll':if(confirm('全記録を削除します。この操作は取り消せません。続ける？')&&confirm('本当に全データを削除する？ バックアップは取りましたか？')){stopAudio();data=initial();ui.tab='home';save();timerReset();render();toast('データを初期化しました')}break;}});
document.addEventListener('change',e=>{const el=e.target;switch(el.dataset.change){case 'timerSubject':if(SUBJECTS.includes(el.value)){data.settings.timerSubject=el.value;save()}break;case 'scoreSubject':ui.scoreSubject=el.value;render();break;case 'noteFilter':ui.noteSubject=el.value;render();break;case 'import':importData(el.files?.[0]);el.value='';break;}});
document.addEventListener('submit',e=>{if(!['timerCustomForm','manualForm','noteForm','planForm','autoPlanForm','scoreForm','profileForm','examForm'].includes(e.target.id))return;e.preventDefault();const f=e.target,v=name=>String(f.elements[name]?.value||'').trim(),s=v('subject');switch(f.id){case 'timerCustomForm':{const h=Number(v('hours')),m=Number(v('minutes')),mode=v('mode');if(!Number.isInteger(h)||!Number.isInteger(m)||h<0||h>10||m<0||m>59||h*60+m<1||h*60+m>600){toast('1分〜10時間の範囲で入力してね');return}preset(h*60+m,mode);break}case 'examForm':{const name=v('examName').slice(0,60),date=v('examDate');if(!name)return toast('試験名を入力してね');if(!validExamDate(date))return toast('正しい試験日を指定してね');const old=data.exams.find(x=>x.id===ui.editExam);if(old){old.name=name;old.date=date;toast('試験日を更新したよ')}else{if(data.exams.length>=30)return toast('登録は最大30件までだよ');data.exams.push({id:uid(),name,date});toast('試験を登録したよ')}data.settings.examDate=date;ui.editExam=null;save();render();break}case 'manualForm':logStudy(v('minutes'),s);break;case 'noteForm':{const title=v('title'),question=v('question'),answer=v('answer');if(!title||!question||!answer){toast('タイトル・問題・答えを入力してね');return}const old=data.notes.find(x=>x.id===ui.editNote);if(old){Object.assign(old,{title,question,answer,subject:s});toast('問題を更新したよ')}else{data.notes.push({id:uid(),title,question,answer,subject:s,createdAt:Date.now(),createdDate:day(),nextReview:day(),step:0,correctCount:0});toast('問題を登録！ 今日の復習に追加したよ')}ui.editNote=null;save();render();break}case 'planForm':{if(!v('title'))return;const minutes=number(v('minutes'));if(minutes<1||minutes>600)return toast('予定時間は1〜600分で入力してね');data.plans.push({id:uid(),title:v('title'),subject:s,date:safeDate(v('date')),minutes,done:false});save();render();toast('予定を追加したよ');break}case 'autoPlanForm':{const lines=v('topics').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const end=safeDate(v('endDate')),span=dayDiff(end,day());const minutes=number(v('minutes'));if(span<0||span>365)return toast('完了日は今日〜1年以内にしてね');if(lines.length===0||lines.length>100)return toast('学習項目は1〜100行で入力してね');if(minutes<1||minutes>600)return toast('時間は1〜600分で入力してね');lines.forEach((title,i)=>{const offset=lines.length===1?span:Math.round(i*span/(lines.length-1));data.plans.push({id:uid(),title:title.slice(0,120),subject:s,date:dayAdd(day(),offset),minutes,done:false})});data.settings.examDate=end;save();render();toast(`${lines.length}件の予定を自動で作成！`);break}case 'scoreForm':{const score=number(v('score')),max=number(v('max'));if(score<0||max<=0||score>max||max>1000)return toast('得点は0以上、満点以下にしてね');if(!v('title'))return;data.scores.push({id:uid(),title:v('title'),subject:s,date:safeDate(v('date')),score,max});ui.scoreSubject=s;save();render();toast('成績を登録したよ');break}case 'profileForm':{const name=v('name');data.settings.name=name.slice(0,25)||'冒険者';save();render();toast('名前を変更したよ');break}}});
function exportData(){const payload={app:'study-quest',version:1,exportedAt:new Date().toISOString(),data};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`study-quest-backup-${day()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('バックアップを保存したよ')}
function importData(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const raw=JSON.parse(String(reader.result));const d=raw.app==='study-quest'?raw.data:raw;if(!d||!Array.isArray(d.logs)||!Array.isArray(d.notes)||!Array.isArray(d.plans)||!Array.isArray(d.scores)||!d.rpg||!d.settings)throw Error('invalid');if(!confirm('今のデータをバックアップファイルで置き換える？'))return;data={...initial(),...d,exams:Array.isArray(d.exams)?d.exams:[],settings:{...initial().settings,...d.settings},rpg:{...initial().rpg,...d.rpg}};ui.editExam=null;save();render();toast('データを復元したよ')}catch(e){toast('このファイルは読み込めませんでした')}};reader.readAsText(file)}
function renderSettings(){return `<div class="card mt16"><div class="card-title">⚙️ 記録の管理・バックアップ</div><form id="profileForm" class="flex-between" style="align-items:end;flex-wrap:wrap"><div class="field" style="flex:1;min-width:150px"><label>冒険者の名前</label><input type="text" name="name" maxlength="25" value="${esc(data.settings.name)}"></div><button class="btn secondary">名前を保存</button></form><div class="divider"></div><div class="buttons"><button class="btn secondary" data-action="export">⬇ バックアップを保存</button><label class="btn secondary file-btn">⬆ バックアップを読み込み<input aria-label="バックアップファイルを読み込み" type="file" accept=".json,application/json" data-change="import"></label><button class="btn danger" data-action="resetAll">全データを削除</button></div><p class="caption">記録はサーバーに送信せず、この端末のブラウザ内にのみ保存されます。Safariの履歴・サイトデータを消すと記録が消える場合があります。定期的にJSONを保存してください。</p></div>`}
const baseRender=renderHome;renderHome=function(){return baseRender()+renderSettings()};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)timerTick()});
window.addEventListener('pageshow',timerTick);
window.addEventListener('focus',timerTick);
setInterval(timerTick,250);
if(timer.running)timerTick();
render();
})();
</script>
